name: Build TAG Timestamp Camera APK

on:
  push:
    branches: [ "tag-apk-build" ]
    paths:
      - ".github/workflows/tag-apk-build.yml"
      - "tag-project/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fetch TAG company logo
        run: |
          mkdir -p tag-project/app/src/main/res/drawable
          curl -fL --retry 3 "https://seashell-giraffe-571836.hostingersite.com/?action=logo" -o tag-project/app/src/main/res/drawable/tag_icon.png
          test -s tag-project/app/src/main/res/drawable/tag_icon.png
          file tag-project/app/src/main/res/drawable/tag_icon.png

      - name: Build installable debug APK
        working-directory: tag-project
        run: gradle --no-daemon assembleDebug

      - name: Validate and rename APK
        run: |
          cp tag-project/app/build/outputs/apk/debug/app-debug.apk TAG_Timestamp_Camera.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose TAG_Timestamp_Camera.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging TAG_Timestamp_Camera.apk | head -n 15
          ls -lh TAG_Timestamp_Camera.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TAG-Timestamp-Camera-APK
          path: TAG_Timestamp_Camera.apk
          if-no-files-found: error
          retention-days: 7

# build trigger 2
